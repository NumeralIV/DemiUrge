; DEMIURGE quality tiers (wave3 perf track, lane perf3; Game/Core/DmRenderTiers.h explains the tiers).
;
; The engine's four scalability levels, redefined for one 100 km planet seen from orbit down to a few hundred metres,
; on the target machine (RTX 3060 12 GB, 1080p, 60 fps). The settings screen maps Low / Medium / High to levels 0 / 1 / 2
; and Auto to the engine's own levels (Epic, 3, on a first run), so:
;
;   3 Epic, 2 High  the approved cinematic look (Lumen GI and reflections, VSM, TSR from the display-based screen
;                   percentage, about 73 % at 1080p), with two changes measured to be invisible in every view and worth
;                   1.1 - 1.7 ms of GPU: TSR history at 100 % instead of Epic's 200 %, and Lumen's screen-probe gather at
;                   the engine's High density (shots/ue-ab-*-base.png vs -hi1.png: mean difference under 1 grey level).
;                   Level 2 is identical to level 3: picking "High" in the settings no longer drops to the engine's High
;                   (which also rendered at 87 % and cost more than Epic).
;   1 Medium        same lighting model, cheaper: 62 % resolution, engine-High TSR / shadows / reflections / post,
;                   no water reflections, shorter view distance.
;   0 Low           50 % resolution, screen-space reflections (Lumen reflections off), cheaper VSM filtering,
;                   engine-Medium TSR / post. Shadows stay on (the terminator and mountain shadows are the game).
;
; Sky atmosphere sample counts are the same in every tier: the atmosphere seen from orbit is the game's signature and
; costs 0.2 - 0.5 ms. Measurements and per-module costs: docs/handoff/done-ue/wave3-perf.built.txt.
; A cvar that one level of a group sets is set by every level of that group (so changing tiers never leaves it behind),
; including the engine base file's keys this file does not tune (scene colour format, detail mode, DOF, heterogeneous
; volumes: written out below with the engine's Epic values at High and Epic, so High really is Epic). The perf-tiers
; scenario checks both: shot.ps1 perf-tiers -noshot -> "DmTiers RESULT PASS".

[ScalabilitySettings]
; screen percentage per level 0, 1, 2, 3, Cine. 0 = the engine's display-based default (about 73 % at 1080p, 50 % at 4K);
; DmRenderTiers puts r.ScreenPercentage back to that default when a 0 level follows a lower one
PerfIndexValues_ResolutionQuality="50 62 0 0 100"

