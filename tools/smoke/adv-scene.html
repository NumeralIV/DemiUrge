<!doctype html>
<!--
  DEMIURGE - tools/smoke/adv-scene.html : adversarial rig test scene (not part of the game).
  A small but real WebGL2 frame of the kind the game will render:
    - displaced icosphere (level 6: 40,962 vertices, 81,920 triangles), per-vertex colour and normal
    - 5,000 instanced low-poly cones (12 triangles each) standing on it
    - sun shadow map: 2048x2048 DEPTH_COMPONENT24 texture, sampled through sampler2DShadow (hardware PCF, 4 taps)
    - main pass into a 4x MSAA RGBA16F renderbuffer + DEPTH_COMPONENT24, resolved by blitFramebuffer
    - one std140 uniform block ("Frame") shared by all five programs
    - ACES tonemapping pass to the canvas
  Query parameters: ?hud=0 hides the text overlay, ?cones=N changes the instance count, ?level=N the icosphere level.
  Page API (for tools/shot.js):
    window.ADV_READY            true once 5 frames have been drawn without a GL error
    ADV.info                    renderer string, framebuffer status, sample counts, block layout, triangle counts
    ADV.stats()                 { frames, fps, rafMeanMs, rafP95Ms, rafMaxMs, cpuMeanMs, gpuMeanMs } over the last <= 240 frames
    ADV.bench(frames = 60)      draws frames back to back, each forced to finish with a 1-pixel readPixels -> { frames, msPerFrame }
    ADV.preset('planet'|'close'|'night'), ADV.setCamera(eye, target, up), ADV.setShadows(bool), ADV.freeze(bool)
-->
<html>
<head>
<meta charset="utf-8">
<title>adv-scene</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.45 Consolas, monospace; color: #d8f0e0; background: rgba(0, 0, 0, .5); padding: 5px 9px; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
'use strict';
(function () {
  const ADV = window.ADV = { ready: false, error: null, info: {} };
  window.ADV_READY = false;
  const qs = new URLSearchParams(location.search);
  const CONES = Math.max(1, +(qs.get('cones') || 5000) | 0);
  const LEVEL = Math.min(7, Math.max(1, +(qs.get('level') || 6) | 0));
  const SHADOW_SIZE = 2048;
  const hud = document.getElementById('hud');
  if (qs.get('hud') === '0') hud.style.display = 'none';

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
  if (!gl) { ADV.error = 'WebGL2 not available'; throw new Error('adv-scene: WebGL2 not available'); }
  if (!gl.getExtension('EXT_color_buffer_float')) { ADV.error = 'EXT_color_buffer_float missing'; throw new Error('adv-scene: EXT_color_buffer_float missing'); }
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
  ADV.info.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

  // ---------------------------------------------------------------------------------------------- maths
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const scl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  function perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
  }
  function ortho(l, r, b, t, n, f) {
    return new Float32Array([2 / (r - l), 0, 0, 0, 0, 2 / (t - b), 0, 0, 0, 0, -2 / (f - n), 0, -(r + l) / (r - l), -(t + b) / (t - b), -(f + n) / (f - n), 1]);
  }
  function lookAt(e, c, u) {
    const z = norm(sub(e, c)), x = norm(cross(u, z)), y = cross(z, x);
    return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1]);
  }
  function mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  }
  function mulberry(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function h3(x, y, z) {
    let n = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x9e3779b1);
    n = Math.imul(n ^ (n >>> 15), 0x85ebca6b); n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let fx = x - xi, fy = y - yi, fz = z - zi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
    const l = (a, b, t) => a + (b - a) * t;
    const v = l(l(l(h3(xi, yi, zi), h3(xi + 1, yi, zi), fx), l(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), fx), fy),
      l(l(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), fx), l(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), fx), fy), fz);
    return v * 2 - 1;
  }
  function fbm(x, y, z) {
    let a = 0.5, f = 1, s = 0;
    for (let i = 0; i < 5; i++) { s += a * vnoise(x * f + 11.3, y * f + 4.7, z * f + 7.9); f *= 2.03; a *= 0.5; }
    return s;
  }
  /** terrain height above the datum sphere (radius 1) in direction d; negative = sea floor */
  const heightAt = d => fbm(d[0] * 1.9, d[1] * 1.9, d[2] * 1.9) * 0.2;

  // ---------------------------------------------------------------------------------------------- geometry
  function icosphere(level) {
    const t = (1 + Math.sqrt(5)) / 2;
    let verts = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map(norm);
    let tris = [0, 11, 5, 0, 5, 1, 0, 1, 7, 0, 7, 10, 0, 10, 11, 1, 5, 9, 5, 11, 4, 11, 10, 2, 10, 7, 6, 7, 1, 8,
      3, 9, 4, 3, 4, 2, 3, 2, 6, 3, 6, 8, 3, 8, 9, 4, 9, 5, 2, 4, 11, 6, 2, 10, 8, 6, 7, 9, 8, 1];
    for (let l = 0; l < level; l++) {
      const cache = new Map(), out = [];
      const mid = (a, b) => {
        const k = a < b ? a * 1e7 + b : b * 1e7 + a;
        let m = cache.get(k);
        if (m === undefined) { m = verts.length; verts.push(norm(add(verts[a], verts[b]))); cache.set(k, m); }
        return m;
      };
      for (let i = 0; i < tris.length; i += 3) {
        const a = tris[i], b = tris[i + 1], c = tris[i + 2], ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
        out.push(a, ab, ca, b, bc, ab, c, ca, bc, ab, bc, ca);
      }
      tris = out;
    }
    return { verts, tris };
  }

  const ico = icosphere(LEVEL);
  const nV = ico.verts.length, nT = ico.tris.length / 3;
  const tPos = new Float32Array(nV * 3), tNrm = new Float32Array(nV * 3), tCol = new Float32Array(nV * 3);
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const sat = x => Math.min(1, Math.max(0, x));
  for (let i = 0; i < nV; i++) {
    const d = ico.verts[i], h = heightAt(d), r = 1 + Math.max(h, 0);
    tPos[i * 3] = d[0] * r; tPos[i * 3 + 1] = d[1] * r; tPos[i * 3 + 2] = d[2] * r;
    let c;
    if (h < 0) c = mixc([0.05, 0.22, 0.42], [0.012, 0.05, 0.16], sat(-h / 0.05));        // sea, darker with depth
    else if (h < 0.006) c = [0.62, 0.56, 0.38];                                            // beach
    else if (h < 0.05) c = mixc([0.20, 0.42, 0.13], [0.30, 0.34, 0.16], sat((h - 0.006) / 0.044)); // lowland
    else if (h < 0.075) c = mixc([0.30, 0.30, 0.20], [0.36, 0.33, 0.31], sat((h - 0.05) / 0.025));  // rock
    else c = [0.86, 0.88, 0.92];                                                           // snow
    tCol[i * 3] = c[0]; tCol[i * 3 + 1] = c[1]; tCol[i * 3 + 2] = c[2];
  }
  for (let i = 0; i < ico.tris.length; i += 3) {
    const a = ico.tris[i] * 3, b = ico.tris[i + 1] * 3, c = ico.tris[i + 2] * 3;
    const pa = [tPos[a], tPos[a + 1], tPos[a + 2]], pb = [tPos[b], tPos[b + 1], tPos[b + 2]], pc = [tPos[c], tPos[c + 1], tPos[c + 2]];
    const n = cross(sub(pb, pa), sub(pc, pa));
    for (const k of [a, b, c]) { tNrm[k] += n[0]; tNrm[k + 1] += n[1]; tNrm[k + 2] += n[2]; }
  }
  for (let i = 0; i < nV; i++) { const n = norm([tNrm[i * 3], tNrm[i * 3 + 1], tNrm[i * 3 + 2]]); tNrm[i * 3] = n[0]; tNrm[i * 3 + 1] = n[1]; tNrm[i * 3 + 2] = n[2]; }
  const tIdx = new Uint32Array(ico.tris);

  // unit cone: 6 sides, base radius 1 at y = 0, apex at y = 1; flat normals; 12 triangles
  const SIDES = 6, coneV = [];
  for (let i = 0; i < SIDES; i++) {
    const a0 = i / SIDES * Math.PI * 2, a1 = (i + 1) / SIDES * Math.PI * 2, am = (a0 + a1) / 2;
    const b0 = [Math.cos(a0), 0, Math.sin(a0)], b1 = [Math.cos(a1), 0, Math.sin(a1)];
    const sn = norm([Math.cos(am), 1, Math.sin(am)]);
    coneV.push(0, 1, 0, ...sn, ...b1, ...sn, ...b0, ...sn);                 // side
    coneV.push(0, 0, 0, 0, -1, 0, ...b0, 0, -1, 0, ...b1, 0, -1, 0);       // base cap
  }
  const coneData = new Float32Array(coneV), coneVerts = coneData.length / 6;

  // cone instances: evenly spread over the land (Fibonacci sphere candidates), deterministic
  const rnd = mulberry(12345);
  let cand = [];
  for (let M = 16000; ; M *= 2) {
    cand = [];
    for (let i = 0; i < M; i++) {
      const y = 1 - 2 * (i + 0.5) / M, rr = Math.sqrt(1 - y * y), ph = i * 2.399963229728653;
      const d = [Math.cos(ph) * rr, y, Math.sin(ph) * rr], h = heightAt(d);
      if (h > 0.008 && h < 0.07) cand.push([d, h]);
    }
    if (cand.length >= CONES || M > 4e6) break;
  }
  const nCones = Math.min(CONES, cand.length);
  const inst = new Float32Array(nCones * 8), coneDirs = [];
  for (let i = 0; i < nCones; i++) {
    const [d, h] = cand[Math.floor(i * cand.length / nCones)];
    const r = 1 + h - 0.003, big = rnd() < 0.08 ? 1.6 : 1;
    const radius = (0.007 + rnd() * 0.005) * big, height = (0.028 + rnd() * 0.025) * big;
    const g = 0.7 + rnd() * 0.5, warm = rnd();
    inst.set([d[0] * r, d[1] * r, d[2] * r, radius, 0.10 * g + 0.25 * warm * warm, 0.34 * g, 0.12 * g, height], i * 8);
    coneDirs.push(d);
  }

  // ---------------------------------------------------------------------------------------------- shaders
  const FRAME = [
    'layout(std140) uniform Frame {',
    '  mat4 uViewProj;',
    '  mat4 uLightViewProj;',
    '  vec4 uSunDir;   // xyz = direction to the sun, w = intensity',
    '  vec4 uCamPos;   // xyz = eye, w = time (s)',
    '  vec4 uParams;   // x = shadows on (0/1), y = normal offset (world units), z = shadow texel (uv), w = exposure',
    '};',
  ].join('\n');
  const head = defs => '#version 300 es\nprecision highp float;\n' + (defs || '') + FRAME + '\n';
  const VS_TERRAIN = `
    layout(location = 0) in vec3 aPos;
    layout(location = 1) in vec3 aNormal;
    layout(location = 2) in vec3 aColor;
    out vec3 vWorld; out vec3 vNormal; out vec3 vColor;
    void main() {
      vWorld = aPos; vNormal = aNormal; vColor = aColor;
    #ifdef SHADOW
      gl_Position = uLightViewProj * vec4(aPos, 1.0);
    #else
      gl_Position = uViewProj * vec4(aPos, 1.0);
    #endif
    }`;
  const VS_CONE = `
    layout(location = 0) in vec3 aPos;
    layout(location = 1) in vec3 aNormal;
    layout(location = 3) in vec4 aInst0;   // xyz = base position, w = radius
    layout(location = 4) in vec4 aInst1;   // rgb = colour, w = height
    out vec3 vWorld; out vec3 vNormal; out vec3 vColor;
    void main() {
      vec3 up = normalize(aInst0.xyz);
      vec3 axis = abs(up.y) > 0.99 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
      vec3 tx = normalize(cross(axis, up));
      vec3 tz = cross(up, tx);
      float r = aInst0.w, h = aInst1.w;
      vec3 wp = aInst0.xyz + tx * (aPos.x * r) + up * (aPos.y * h) + tz * (aPos.z * r);
      vWorld = wp;
      vNormal = normalize(tx * (aNormal.x / r) + up * (aNormal.y / h) + tz * (aNormal.z / r));
      vColor = aInst1.rgb;
    #ifdef SHADOW
      gl_Position = uLightViewProj * vec4(wp, 1.0);
    #else
      gl_Position = uViewProj * vec4(wp, 1.0);
    #endif
    }`;
  const FS_LIT = `
    uniform highp sampler2DShadow uShadow;
    in vec3 vWorld; in vec3 vNormal; in vec3 vColor;
    out vec4 oColor;
    float shadowTerm(vec3 wp, vec3 n, float ndl) {
      vec4 lp = uLightViewProj * vec4(wp + n * uParams.y, 1.0);
      vec3 sc = lp.xyz / lp.w * 0.5 + 0.5;
      float zref = sc.z - mix(0.0012, 0.0004, clamp(ndl, 0.0, 1.0));
      float t = uParams.z * 0.5;
      float s = texture(uShadow, vec3(sc.xy + vec2(-t, -t), zref)) + texture(uShadow, vec3(sc.xy + vec2(t, -t), zref))
              + texture(uShadow, vec3(sc.xy + vec2(-t, t), zref)) + texture(uShadow, vec3(sc.xy + vec2(t, t), zref));
      return mix(1.0, s * 0.25, uParams.x);
    }
    void main() {
      vec3 n = normalize(vNormal);
      vec3 L = uSunDir.xyz;
      vec3 zen = normalize(vWorld);
      float ndl = dot(n, L);
      float sh = ndl > 0.0 ? shadowTerm(vWorld, n, ndl) : 0.0;
      vec3 sun = vec3(1.0, 0.94, 0.82) * uSunDir.w * max(ndl, 0.0) * sh;
      float day = smoothstep(-0.25, 0.35, dot(zen, L));
      vec3 amb = mix(vec3(0.03, 0.03, 0.04), vec3(0.16, 0.22, 0.34), 0.5 + 0.5 * dot(n, zen)) * mix(0.06, 1.0, day);
      oColor = vec4(vColor * (sun + amb), 1.0);   // linear HDR, well above 1.0 in full sun
    }`;
  const FS_DEPTH = 'void main() {}';
  const VS_TONE = `
    out vec2 vUv;
    void main() {
      vUv = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
      gl_Position = vec4(vUv * 2.0 - 1.0, 0.0, 1.0);
    }`;
  const FS_TONE = `
    uniform sampler2D uHdr;
    in vec2 vUv;
    out vec4 oColor;
    vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    void main() {
      vec3 c = aces(texture(uHdr, vUv).rgb * uParams.w);
      oColor = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
    }`;

  function program(name, vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('adv-scene: ' + name + ' shader: ' + gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('adv-scene: ' + name + ' link: ' + gl.getProgramInfoLog(p));
    const bi = gl.getUniformBlockIndex(p, 'Frame');
    if (bi === gl.INVALID_INDEX) throw new Error('adv-scene: ' + name + ': uniform block Frame is not active');
    gl.uniformBlockBinding(p, bi, 0);
    const names = ['uViewProj', 'uLightViewProj', 'uSunDir', 'uCamPos', 'uParams'];
    const idx = gl.getUniformIndices(p, names);
    const offs = gl.getActiveUniforms(p, idx, gl.UNIFORM_OFFSET);
    blocks[name] = { size: gl.getActiveUniformBlockParameter(p, bi, gl.UNIFORM_BLOCK_DATA_SIZE), offsets: Array.from(offs) };
    return p;
  }
  const blocks = ADV.info.uniformBlock = {};
  const progTerrain = program('terrain', head() + VS_TERRAIN, head() + FS_LIT);
  const progCone = program('cone', head() + VS_CONE, head() + FS_LIT);
  const progTerrainDepth = program('terrainDepth', head('#define SHADOW\n') + VS_TERRAIN, '#version 300 es\nprecision highp float;\n' + FS_DEPTH);
  const progConeDepth = program('coneDepth', head('#define SHADOW\n') + VS_CONE, '#version 300 es\nprecision highp float;\n' + FS_DEPTH);
  const progTone = program('tonemap', '#version 300 es\nprecision highp float;\n' + VS_TONE, head() + FS_TONE);
  for (const p of [progTerrain, progCone]) { gl.useProgram(p); gl.uniform1i(gl.getUniformLocation(p, 'uShadow'), 0); }
  gl.useProgram(progTone); gl.uniform1i(gl.getUniformLocation(progTone, 'uHdr'), 1);

  // ---------------------------------------------------------------------------------------------- buffers
  const buf = (target, data) => { const b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, gl.STATIC_DRAW); return b; };
  const vaoTerrain = gl.createVertexArray();
  gl.bindVertexArray(vaoTerrain);
  [tPos, tNrm, tCol].forEach((d, i) => { buf(gl.ARRAY_BUFFER, d); gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i, 3, gl.FLOAT, false, 0, 0); });
  buf(gl.ELEMENT_ARRAY_BUFFER, tIdx);
  const vaoCone = gl.createVertexArray();
  gl.bindVertexArray(vaoCone);
  buf(gl.ARRAY_BUFFER, coneData);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  buf(gl.ARRAY_BUFFER, inst);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(3, 1);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(4, 1);
  gl.bindVertexArray(null);

  const frameData = new Float32Array(44);      // 176 bytes: mat4, mat4, vec4, vec4, vec4
  const ubo = gl.createBuffer();
  gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
  gl.bufferData(gl.UNIFORM_BUFFER, frameData.byteLength, gl.DYNAMIC_DRAW);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, ubo);

  // ---------------------------------------------------------------------------------------------- targets
  const fbStatus = () => { const s = gl.checkFramebufferStatus(gl.FRAMEBUFFER); return s === gl.FRAMEBUFFER_COMPLETE ? 'COMPLETE' : '0x' + s.toString(16); };
  const shadowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, SHADOW_SIZE, SHADOW_SIZE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  const fboShadow = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboShadow);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
  gl.drawBuffers([gl.NONE]);
  gl.readBuffer(gl.NONE);
  ADV.info.shadowFramebuffer = fbStatus();
  ADV.info.shadowMap = SHADOW_SIZE + 'x' + SHADOW_SIZE + ' DEPTH_COMPONENT24, sampler2DShadow, LINEAR compare';

  let W = 0, H = 0, fboMsaa = null, fboResolve = null, rbColor = null, rbDepth = null, hdrTex = null;
  function resize() {
    const w = Math.max(1, Math.round(canvas.clientWidth * devicePixelRatio)), h = Math.max(1, Math.round(canvas.clientHeight * devicePixelRatio));
    if (w === W && h === H) return;
    W = canvas.width = w; H = canvas.height = h;
    for (const o of [rbColor, rbDepth]) if (o) gl.deleteRenderbuffer(o);
    if (hdrTex) gl.deleteTexture(hdrTex);
    for (const o of [fboMsaa, fboResolve]) if (o) gl.deleteFramebuffer(o);
    const want = Math.min(4, gl.getParameter(gl.MAX_SAMPLES));
    rbColor = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rbColor);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, want, gl.RGBA16F, W, H);
    ADV.info.samples = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_SAMPLES);
    rbDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rbDepth);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, want, gl.DEPTH_COMPONENT24, W, H);
    fboMsaa = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboMsaa);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbColor);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rbDepth);
    ADV.info.msaaFramebuffer = fbStatus();
    hdrTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, hdrTex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, W, H);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    fboResolve = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboResolve);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, hdrTex, 0);
    ADV.info.resolveFramebuffer = fbStatus();
    ADV.info.target = W + 'x' + H + ' RGBA16F + DEPTH_COMPONENT24, ' + ADV.info.samples + 'x MSAA, blit resolve';
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // ---------------------------------------------------------------------------------------------- scene state
  const SUN = norm([0.8, 0.35, 0.5]);
  const lightVP = mul(ortho(-1.2, 1.2, -1.2, 1.2, 1.5, 4.5), lookAt(scl(SUN, 3), [0, 0, 0], [0, 1, 0]));
  const cam = { eye: [0, 0, 3.6], target: [0, 0, 0], up: [0, 1, 0], fov: 38 * Math.PI / 180, near: 0.02, far: 12 };
  let shadowsOn = true, frozen = false, time = 0, spinBase = null;
  const rotY = (v, a) => [v[0] * Math.cos(a) + v[2] * Math.sin(a), v[1], -v[0] * Math.sin(a) + v[2] * Math.cos(a)];

  ADV.setCamera = (eye, target, up) => { cam.eye = eye; cam.target = target || [0, 0, 0]; cam.up = up || [0, 1, 0]; spinBase = null; };
  ADV.setShadows = on => { shadowsOn = !!on; return shadowsOn; };
  ADV.freeze = on => { frozen = on !== false; return frozen; };
  ADV.preset = name => {
    if (name === 'planet') {            // whole planet, terminator in view, slowly orbiting unless frozen
      ADV.setCamera(scl(rotY(norm([SUN[0], 0.25, SUN[2]]), 1.15), 3.6));
      spinBase = cam.eye.slice();
    } else if (name === 'night') {      // from behind: almost everything in the planet's own shadow
      ADV.setCamera(scl(SUN, -3.6));
    } else if (name === 'close') {      // low over the surface where the sun is about 33 degrees up, looking across the shadows
      let best = 0, bestScore = -1;
      for (let i = 0; i < coneDirs.length; i++) {
        const e = Math.abs(dot(coneDirs[i], SUN) - 0.55);
        if (e > 0.02) continue;
        let near = 0;
        for (let j = 0; j < coneDirs.length; j += 3) if (dot(coneDirs[i], coneDirs[j]) > 0.985) near++;
        if (near > bestScore) { bestScore = near; best = i; }
      }
      const P = coneDirs[best], side = norm(cross(P, SUN));
      ADV.setCamera(add(scl(P, 1.22), scl(side, 0.30)), scl(P, 1.01), P);
    } else throw new Error('ADV.preset: unknown preset ' + name);
    return name;
  };

  function draw() {
    resize();
    if (spinBase && !frozen) cam.eye = rotY(spinBase, time * 0.12);
    const vp = mul(perspective(cam.fov, W / H, cam.near, cam.far), lookAt(cam.eye, cam.target, cam.up));
    frameData.set(vp, 0);
    frameData.set(lightVP, 16);
    frameData.set([SUN[0], SUN[1], SUN[2], 3.2], 32);
    frameData.set([cam.eye[0], cam.eye[1], cam.eye[2], time], 36);
    frameData.set([shadowsOn ? 1 : 0, 2.4 / SHADOW_SIZE * 2.0, 1 / SHADOW_SIZE, 1.0], 40);
    gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, frameData);

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(true);

    // 1. sun shadow map
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboShadow);
    gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
    gl.clearDepth(1);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(1.5, 2.0);
    gl.enable(gl.CULL_FACE);
    gl.useProgram(progTerrainDepth);
    gl.bindVertexArray(vaoTerrain);
    gl.drawElements(gl.TRIANGLES, tIdx.length, gl.UNSIGNED_INT, 0);
    gl.disable(gl.CULL_FACE);
    gl.useProgram(progConeDepth);
    gl.bindVertexArray(vaoCone);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, coneVerts, nCones);
    gl.disable(gl.POLYGON_OFFSET_FILL);

    // 2. lit scene into the multisampled HDR target
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboMsaa);
    gl.viewport(0, 0, W, H);
    gl.clearColor(0.004, 0.006, 0.014, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    gl.enable(gl.CULL_FACE);
    gl.useProgram(progTerrain);
    gl.bindVertexArray(vaoTerrain);
    gl.drawElements(gl.TRIANGLES, tIdx.length, gl.UNSIGNED_INT, 0);
    gl.disable(gl.CULL_FACE);
    gl.useProgram(progCone);
    gl.bindVertexArray(vaoCone);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, coneVerts, nCones);

    // 3. resolve
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboMsaa);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboResolve);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);

    // 4. tonemap to the canvas
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.DEPTH_TEST);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, hdrTex);
    gl.useProgram(progTone);
    gl.bindVertexArray(null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.activeTexture(gl.TEXTURE0);
  }

  // ---------------------------------------------------------------------------------------------- timing
  const RING = 240;
  const raf = [], cpu = [], gpu = [];
  const push = (a, v) => { a.push(v); if (a.length > RING) a.shift(); };
  const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
  const r2 = v => v === null ? null : +v.toFixed(3);
  let frames = 0, lastNow = 0, query = null, t0 = performance.now();

  ADV.stats = () => {
    const sorted = raf.slice().sort((a, b) => a - b);
    const m = mean(raf);
    return { frames, fps: m ? +(1000 / m).toFixed(1) : null, rafMeanMs: r2(m), rafP95Ms: sorted.length ? r2(sorted[Math.floor(sorted.length * 0.95)]) : null,
      rafMaxMs: sorted.length ? r2(sorted[sorted.length - 1]) : null, cpuMeanMs: r2(mean(cpu)), gpuMeanMs: r2(mean(gpu)), gpuSamples: gpu.length };
  };
  /** Cost of one frame: `n` frames back to back, each forced to complete with a 1-pixel readback of the canvas. */
  ADV.bench = n => {
    n = n || 60;
    const px = new Uint8Array(4);
    draw(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);    // warm-up
    const a = performance.now();
    for (let i = 0; i < n; i++) { draw(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    const ms = performance.now() - a;
    const e = gl.getError();
    return { frames: n, msPerFrame: +(ms / n).toFixed(3), glError: e ? '0x' + e.toString(16) : null };
  };

  function frame(now) {
    requestAnimationFrame(frame);
    if (lastNow) push(raf, now - lastNow);
    lastNow = now;
    if (!frozen) time = (performance.now() - t0) / 1000;
    if (timerExt && query && gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)) {
      if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) push(gpu, gl.getQueryParameter(query, gl.QUERY_RESULT) / 1e6);
      gl.deleteQuery(query);
      query = null;
    }
    const timed = timerExt && !query;
    let q = null;
    if (timed) { q = gl.createQuery(); gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q); }
    const c0 = performance.now();
    draw();
    push(cpu, performance.now() - c0);
    if (timed) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); query = q; }
    frames++;
    if (frames === 5) {
      const e = gl.getError();
      ADV.info.glError = e ? '0x' + e.toString(16) : null;
      const bad = e || ADV.info.msaaFramebuffer !== 'COMPLETE' || ADV.info.resolveFramebuffer !== 'COMPLETE' || ADV.info.shadowFramebuffer !== 'COMPLETE';
      if (bad) { ADV.error = 'GL error or incomplete framebuffer: ' + JSON.stringify(ADV.info); console.error('adv-scene: ' + ADV.error); }
      else { ADV.ready = true; window.ADV_READY = true; }
    }
    if (frames % 20 === 0 && hud.style.display !== 'none') {
      const s = ADV.stats();
      hud.textContent = 'adv-scene  ' + ADV.info.renderer + '\n' + ADV.info.target + '\n' +
        nT + ' terrain tris, ' + nCones + ' cones x ' + (coneVerts / 3) + ' tris, shadow ' + SHADOW_SIZE + (shadowsOn ? '' : ' (off)') + '\n' +
        'raf ' + s.rafMeanMs + ' ms (' + s.fps + ' fps)   cpu ' + s.cpuMeanMs + ' ms   gpu ' + (s.gpuMeanMs === null ? 'n/a' : s.gpuMeanMs + ' ms');
    }
  }

  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ADV.error = 'context lost'; console.error('adv-scene: WebGL context lost'); });
  Object.assign(ADV.info, { cones: nCones, coneTriangles: nCones * coneVerts / 3, terrainVertices: nV, terrainTriangles: nT, icosphereLevel: LEVEL,
    timerQuery: !!timerExt, dpr: devicePixelRatio });
  ADV.preset('planet');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
