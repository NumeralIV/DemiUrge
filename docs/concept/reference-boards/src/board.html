<!doctype html><html><head><meta charset="utf-8"><title>board</title>
<style>
@font-face{font-family:Inter;src:url(../../../../assets/fonts/inter/Inter-Regular.ttf)}
html,body{margin:0;background:#0b0f17;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif}
#hero{position:absolute;left:0;top:0;width:1280px;height:720px}
.crop{position:absolute;left:1280px;width:640px;height:360px;overflow:hidden;box-shadow:inset 0 0 0 0 #000}
.crop img{position:absolute;width:2560px;height:1440px;image-rendering:auto}
.crop+.crop{border-top:0}
#pal{position:absolute;left:0;top:720px;width:1280px;height:360px;display:flex;flex-direction:column}
.row{display:flex;flex:1}
.sw{flex:1;position:relative}
.sw span{position:absolute;left:12px;bottom:12px;font-size:19px;letter-spacing:.02em}
.g{flex:0 0 96px}
.sep{position:absolute;left:1280px;width:640px;height:2px;background:#0b0f17}
</style></head><body>
<img id="hero"><div id="crops"></div><div id="pal"><div class="row" id="c"></div><div class="row g" id="g"></div></div>
<script src="boards.js"></script>
<script>
const name=new URLSearchParams(location.search).get('b'); const d=BOARDS[name];
document.getElementById('hero').src='../hero-'+name+'.png';
d.crops.forEach(([x,y],i)=>{const c=document.createElement('div');c.className='crop';c.style.top=(i*360)+'px';
 const im=new Image();im.src='../hero-'+name+'.png';im.style.left=(-2*x)+'px';im.style.top=(-2*y)+'px';c.appendChild(im);document.getElementById('crops').appendChild(c);
 if(i){const s=document.createElement('div');s.className='sep';s.style.top=(i*360-1)+'px';document.body.appendChild(s);}});
const lin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};
d.palette.forEach(p=>{const s=document.createElement('div');s.className='sw';s.style.background=p.hex;
 const t=document.createElement('span');t.textContent=p.hex;t.style.color=p.Y>.18?'#141414':'#f2efe8';s.appendChild(t);document.getElementById('c').appendChild(s);
 const r=parseInt(p.hex.slice(1,3),16),g=parseInt(p.hex.slice(3,5),16),b=parseInt(p.hex.slice(5,7),16);
 const Y=.2126*lin(r)+.7152*lin(g)+.0722*lin(b); const v=Math.round(255*(Y<=.0031308?12.92*Y:1.055*Math.pow(Y,1/2.4)-.055));
 const q=document.createElement('div');q.className='sw';q.style.background=`rgb(${v},${v},${v})`;document.getElementById('g').appendChild(q);});
Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>{document.title='ready-'+name});
</script></body></html>
